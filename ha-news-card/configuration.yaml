# Feedparser-Sensoren für das Morgenbriefing
# Voraussetzung: HACS-Integration "feedparser" (custom-components/feedparser)
#
# Die regionale Feed-URL an das eigene Bundesland anpassen –
# Tabelle mit URLs siehe README.md. URL vorher im Browser testen!

sensor:
  - platform: feedparser
    name: Tagesschau
    feed_url: "https://www.tagesschau.de/index~rss2.xml"
    date_format: "%d.%m. %H:%M"
    local_time: true
    scan_interval:
      minutes: 30
    inclusions:
      - title
      - link
      - published

  - platform: feedparser
    name: News Regional
    # Beispiel NRW (WDR) – URL für die eigene Region eintragen:
    feed_url: "https://www1.wdr.de/uebersicht-100.feed"
    date_format: "%d.%m. %H:%M"
    local_time: true
    scan_interval:
      minutes: 30
    inclusions:
      - title
      - link
      - published
